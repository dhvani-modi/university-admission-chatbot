<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Admission Assistant</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-wrapper">

        <div class="chat-container">

            <!-- Header -->
            <div class="chat-header">
                <div class="bot-icon">
                    <i class="bi bi-robot"></i>
                </div>

                <div>
                    <h2>University Admission Assistant</h2>
                    <p>
                        <span class="status-dot"></span>
                        Online • Indus University
                    </p>
                </div>
            </div>


            <!-- Chat Area -->
            <div class="chat-body" id="chatBody">

                <div class="message bot-message">
                    <div class="message-icon">
                        <i class="bi bi-robot"></i>
                    </div>

                    <div class="message-content">
                        <strong>Admission Assistant</strong>
                        <p>
                            Hello! 👋<br>
                            I can help you with university admission
                            requirements, eligibility, fees and other
                            admission-related information.
                        </p>
                    </div>
                </div>

            </div>


            <!-- Input Area -->
            <div class="chat-input-area">

                <input
                    type="text"
                    id="questionInput"
                    placeholder="Ask your admission question..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    <i class="bi bi-send-fill"></i>
                </button>

            </div>

            <div class="footer-text">
                AI-powered University Admission Assistant
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
